# Runs the automated tests on every push and pull request (see docs/testing.md).
name: Tests

on:
  push:
  pull_request:

env:
  GODOT_VERSION: 4.7.1

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Run unit tests
        run: dotnet test tests/unit --logger "console;verbosity=normal"

  smoke:
    name: Godot smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-mono-linux

      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot

      - name: Find the Godot binary
        run: |
          GODOT=$(find ~/godot -type f -name "Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64" | head -n 1)
          chmod +x "$GODOT"
          echo "GODOT=$GODOT" >> "$GITHUB_ENV"

      # Importing the photogrammetry models is the slowest step, so keep the
      # results between runs until an asset changes.
      - name: Cache imported assets
        uses: actions/cache@v4
        with:
          path: .godot/imported
          key: godot-import-${{ hashFiles('assets/**', '**/*.import') }}
          restore-keys: godot-import-

      - name: Build the C# project
        run: dotnet build MarbleMadness3D.csproj

      - name: Import assets
        run: '"$GODOT" --headless --path . --import'

      - name: Run the smoke test
        run: '"$GODOT" --headless --path . res://tests/smoke/SmokeTest.tscn'
